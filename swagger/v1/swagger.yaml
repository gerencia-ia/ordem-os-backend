  "/api/v1/users":
    get:
      summary: Lista usuários do sistema
      tags:
      - Usuários
      description: Retorna a lista de usuários e seus respectivos papéis. Restrito
        a Administradores e Secretárias.
      operationId: getUsers
      responses:
        '200':
          description: Lista de usuários retornada
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    nome:
                      type: string
                      example: Letícia Andreia
                    cpf:
                      type: string
                      example: '33333333333'
                    email:
                      type: string
                      example: leticia@example.com
                    telefone:
                      type: string
                      example: '11997499375'
                    role_id:
                      type: integer
                      example: 3
                    role:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 3
                        nome:
                          type: string
                          example: Administrador
        '403':
          description: Acesso negado (Técnicos não podem listar todos os usuários)
          content:
            application/json:
              schema:
                type: object
    post:
      summary: Cadastra um novo usuário
      tags:
      - Usuários
      description: Cria um novo usuário e define seu papel no sistema (apenas Administradores).
      operationId: createUser
      parameters: []
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                type: object
        '422':
          description: 'Erro de validação (ex: CPF já cadastrado ou campos faltantes)'
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    nome:
                      type: string
                      example: Rodrigo Mendonça
                    cpf:
                      type: string
                      example: '66677788899'
                    email:
                      type: string
                      example: rodrigo.tecnico@example.com
                    telefone:
                      type: string
                      example: '11987654321'
                    password:
                      type: string
                      example: senhaSegura#2026
                    role_id:
                      type: integer
                      description: '1: Secretaria, 2: Técnico, 3: Administrador'
                      example: 2
                  required:
                  - nome
                  - cpf
                  - password
                  - role_id
              required:
              - user
  "/api/v1/users/{id}":
    parameters:
    - name: id
      in: path
      description: ID único do Usuário
      example: 1
      required: true
      schema:
        type: integer
    get:
      summary: Visualiza detalhes de um usuário
      tags:
      - Usuários
      operationId: getUser
      responses:
        '200':
          description: Usuário localizado
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                type: object
    patch:
      summary: Atualiza dados de um usuário
      tags:
      - Usuários
      description: Atualiza informações do usuário. Apenas Administradores podem alterar
        o role_id; usuários comuns só podem editar seus próprios dados básicos (telefone,
        email, senha).
      operationId: updateUser
      parameters: []
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    nome:
                      type: string
                      example: Rodrigo Mendonça Jr
                    telefone:
                      type: string
                      example: '11999998888'
                    email:
                      type: string
                      example: rodrigo.novo@example.com
                    password:
                      type: string
                      example: novaSenha#2026
                    role_id:
                      type: integer
                      example: 2
    delete:
      summary: Remove um usuário
      tags:
      - Usuários
      description: Exclui um usuário do sistema (apenas Administradores, não sendo
        permitido auto-exclusão).
      operationId: deleteUser
      responses:
        '204':
          description: Usuário excluído
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                type: object
