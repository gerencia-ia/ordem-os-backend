---
openapi: 3.0.1
info:
  title: Ordem OS API
  version: v1
  description: "API REST para gerenciamento de Ordens de Serviço, Clientes, Equipamentos
    e Catálogo.\n\n## Autenticação\nEsta API utiliza autenticação por **Bearer Token**
    via Sessões nativas do Rails 8.\n1. Efetue login em `POST /api/v1/login` informando
    seu CPF e senha.\n2. Copie o `token` retornado.\n3. Clique no botão verde **Authorize
    \U0001F513** no topo desta página e informe o token (ex: `Bearer seu_token` ou
    apenas `seu_token`).\n4. Todas as rotas protegidas passarão a enviar o header
    automaticamente.\n\nDesenvolvida em **Ruby on Rails 8.0** e **Ruby 3.4**.\n"
servers:
- url: "/"
  description: Servidor Atual (Local / Ambiente Ativo)
- url: https://ordem-os-backend.onrender.com
  description: Ambiente de Produção (Render)
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: 'Token de autenticação retornado no login (/api/v1/login). Exemplo:
        Bearer <token> ou apenas <token>'
security:
- bearer_auth: []
paths:
  "/api/v1/andares":
    get:
      summary: Lista andares
      tags:
      - Andares
      description: Retorna a lista de andares cadastrados.
      operationId: getAndares
      responses:
        '200':
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    descricao:
                      type: string
                      example: Exemplo descricao
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                type: object
    post:
      summary: Cadastra um novo andar
      tags:
      - Andares
      operationId: createAndar
      parameters: []
      responses:
        '201':
          description: Registro cadastrado com sucesso
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Erro de validação
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                andar:
                  type: object
                  properties:
                    descricao:
                      type: string
                      example: Exemplo descricao
                  required:
                  - descricao
              required:
              - andar
  "/api/v1/andares/{id}":
    parameters:
    - name: id
      in: path
      description: ID único de Andar
      example: 1
      required: true
      schema:
        type: integer
    get:
      summary: Visualiza detalhes de andar
      tags:
      - Andares
      operationId: getAndar
      responses:
        '200':
          description: Registro encontrado
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Registro não encontrado
          content:
            application/json:
              schema:
                type: object
    patch:
      summary: Atualiza andar
      tags:
      - Andares
      operationId: updateAndar
      parameters: []
      responses:
        '200':
          description: Registro atualizado
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Erro de validação
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                andar:
                  type: object
                  properties:
                    descricao:
                      type: string
                      example: Exemplo descricao
    delete:
      summary: Remove andar
      tags:
      - Andares
      operationId: deleteAndar
      responses:
        '204':
          description: Registro removido
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                type: object
  "/api/v1/categorias_servico":
    get:
      summary: Lista categorias de serviço
      tags:
      - Categorias de Serviço
      description: 'Retorna as categorias que agrupam os serviços prestados (ex: Higienização,
        Instalação, Reparo Elétrico).'
      operationId: getCategoriasServico
      responses:
        '200':
          description: Lista de categorias retornada
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    descricao:
                      type: string
                      example: Manutenção Preventiva
    post:
      summary: Cadastra uma nova categoria
      tags:
      - Categorias de Serviço
      operationId: createCategoriaServico
      parameters: []
      responses:
        '201':
          description: Categoria criada com sucesso
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                categorias_servico:
                  type: object
                  properties:
                    descricao:
                      type: string
                      example: Instalação e Infraestrutura
                  required:
                  - descricao
              required:
              - categorias_servico
  "/api/v1/categorias_servico/{id}":
    parameters:
    - name: id
      in: path
      description: ID único da Categoria
      example: 1
      required: true
      schema:
        type: integer
    get:
      summary: Visualiza detalhes de uma categoria
      tags:
      - Categorias de Serviço
      operationId: getCategoriaServico
      responses:
        '200':
          description: Categoria localizada
          content:
            application/json:
              schema:
                type: object
    patch:
      summary: Atualiza a descrição de uma categoria
      tags:
      - Categorias de Serviço
      operationId: updateCategoriaServico
      parameters: []
      responses:
        '200':
          description: Categoria atualizada
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                categorias_servico:
                  type: object
                  properties:
                    descricao:
                      type: string
                      example: Instalação, Tubulação e Infraestrutura
    delete:
      summary: Remove uma categoria de serviço
      tags:
      - Categorias de Serviço
      operationId: deleteCategoriaServico
      responses:
        '204':
          description: Categoria removida
  "/api/v1/clientes":
    get:
      summary: Lista todos os clientes
      tags:
      - Clientes
      description: Retorna a lista completa de clientes cadastrados, incluindo seus
        respectivos endereços e telefones.
      operationId: getClientes
      responses:
        '200':
          description: Lista de clientes retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    nome:
                      type: string
                      example: João da Silva
                    email:
                      type: string
                      example: joao.silva@email.com
                    data_registro:
                      type: string
                      format: date
                      example: '2026-01-10'
                    data_ultima_visita:
                      type: string
                      format: date
                      example: '2026-03-15'
                    enderecos:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          rua:
                            type: string
                            example: Av. Paulista
                          numero:
                            type: string
                            example: '1000'
                          bairro:
                            type: string
                            example: Bela Vista
                          complemento:
                            type: string
                            example: Apto 42
                          cep:
                            type: string
                            example: '01310100'
                          cidade:
                            type: string
                            example: São Paulo
                    telefones:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          numero:
                            type: string
                            example: '11988887777'
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Não autorizado
    post:
      summary: Cadastra um novo cliente
      tags:
      - Clientes
      description: Cria um novo cliente com suporte a cadastro aninhado de endereços,
        telefones e equipamentos em uma única requisição.
      operationId: createCliente
      parameters: []
      responses:
        '201':
          description: Cliente cadastrado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 10
                  nome:
                    type: string
                    example: Supermercado Progresso Ltda
                  email:
                    type: string
                    example: contato@superprogresso.com.br
                  enderecos:
                    type: array
                    items:
                      type: object
                  telefones:
                    type: array
                    items:
                      type: object
        '422':
          description: Erro de validação cadastral
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    example:
                      enderecos:
                      - deve conter ao menos um endereço
                      telefones:
                      - deve conter ao menos um telefone
        '403':
          description: Acesso negado (permissão insuficiente)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Acesso negado
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cliente:
                  type: object
                  properties:
                    nome:
                      type: string
                      example: Supermercado Progresso Ltda
                    email:
                      type: string
                      example: contato@superprogresso.com.br
                    data_registro:
                      type: string
                      format: date
                      example: '2026-11-08'
                    data_ultima_visita:
                      type: string
                      format: date
                      example: '2026-11-08'
                    enderecos_attributes:
                      type: array
                      description: Lista de endereços (obrigatório ao menos 1)
                      items:
                        type: object
                        properties:
                          rua:
                            type: string
                            example: Rua do Comércio
                          numero:
                            type: string
                            example: '500'
                          bairro:
                            type: string
                            example: Centro Comercial
                          complemento:
                            type: string
                            example: Galpão 2
                          cep:
                            type: string
                            example: '45600000'
                          cidade:
                            type: string
                            example: Itabuna
                        required:
                        - rua
                        - numero
                        - bairro
                        - cidade
                    telefones_attributes:
                      type: array
                      description: Lista de telefones (obrigatório ao menos 1)
                      items:
                        type: object
                        properties:
                          numero:
                            type: string
                            example: '73988889999'
                        required:
                        - numero
                    equipamentos_attributes:
                      type: array
                      description: Equipamentos do cliente cadastrados previamente
                      items:
                        type: object
                        properties:
                          marca:
                            type: string
                            example: Carrier
                          btus:
                            type: integer
                            example: 36000
                          local_instalacao:
                            type: string
                            example: Área de Vendas - Caixa 1
                          observacao:
                            type: string
                            example: Revisão preventiva semestral
                  required:
                  - nome
                  - enderecos_attributes
                  - telefones_attributes
              required:
              - cliente
  "/api/v1/clientes/{id}":
    parameters:
    - name: id
      in: path
      description: ID único do cliente
      example: 1
      required: true
      schema:
        type: integer
    get:
      summary: Visualiza detalhes de um cliente
      tags:
      - Clientes
      description: Retorna as informações completas de um cliente específico com seus
        endereços e telefones.
      operationId: getCliente
      responses:
        '200':
          description: Cliente localizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  nome:
                    type: string
                    example: João da Silva
                  email:
                    type: string
                    example: joao.silva@email.com
                  enderecos:
                    type: array
                    items:
                      type: object
                  telefones:
                    type: array
                    items:
                      type: object
        '404':
          description: Cliente não encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Not found
    patch:
      summary: Atualiza dados de um cliente
      tags:
      - Clientes
      description: Atualiza os dados cadastrais, telefones ou endereços de um cliente
        existente.
      operationId: updateCliente
      parameters: []
      responses:
        '200':
          description: Cliente atualizado com sucesso
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Erro de validação
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Cliente não encontrado
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cliente:
                  type: object
                  properties:
                    nome:
                      type: string
                      example: Supermercado Progresso Matriz
                    email:
                      type: string
                      example: financeiro@superprogresso.com.br
                    data_ultima_visita:
                      type: string
                      format: date
                      example: '2026-11-08'
    delete:
      summary: Remove um cliente
      tags:
      - Clientes
      description: Exclui um cliente da base (apenas Administrador ou Secretaria).
        Retorna 422 se possuir ordens associadas com restrição.
      operationId: deleteCliente
      responses:
        '204':
          description: Cliente removido com sucesso
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Cliente não encontrado
          content:
            application/json:
              schema:
                type: object
  "/api/v1/equipamentos":
    get:
      summary: Lista equipamentos
      tags:
      - Equipamentos
      description: Retorna todos os equipamentos cadastrados, com opção de filtrar
        por cliente.
      operationId: getEquipamentos
      parameters:
      - name: cliente_id
        in: query
        required: false
        description: Filtrar equipamentos por ID do cliente
        schema:
          type: integer
      responses:
        '200':
          description: Lista de equipamentos retornada
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    marca:
                      type: string
                      example: Daikin
                    btus:
                      type: integer
                      example: 18000
                    local_instalacao:
                      type: string
                      example: Escritório Diretoria
                    observacao:
                      type: string
                      example: Instalado em 2024
                    cliente_id:
                      type: integer
                      example: 1
    post:
      summary: Cadastra um novo equipamento
      tags:
      - Equipamentos
      description: Cadastra um novo equipamento associado a um cliente existente.
      operationId: createEquipamento
      parameters: []
      responses:
        '201':
          description: Equipamento cadastrado com sucesso
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Erro de validação
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                equipamento:
                  type: object
                  properties:
                    marca:
                      type: string
                      example: Springer Midea Inverter
                    btus:
                      type: integer
                      example: 12000
                    local_instalacao:
                      type: string
                      example: Sala de Reuniões 02
                    observacao:
                      type: string
                      example: Voltagem 220V monofásica
                    cliente_id:
                      type: integer
                      example: 1
                  required:
                  - marca
                  - btus
                  - cliente_id
              required:
              - equipamento
  "/api/v1/equipamentos/{id}":
    parameters:
    - name: id
      in: path
      description: ID único do Equipamento
      example: 1
      required: true
      schema:
        type: integer
    get:
      summary: Visualiza detalhes de um equipamento
      tags:
      - Equipamentos
      operationId: getEquipamento
      responses:
        '200':
          description: Equipamento encontrado
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Equipamento não encontrado
          content:
            application/json:
              schema:
                type: object
    patch:
      summary: Atualiza dados de um equipamento
      tags:
      - Equipamentos
      operationId: updateEquipamento
      parameters: []
      responses:
        '200':
          description: Equipamento atualizado
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                equipamento:
                  type: object
                  properties:
                    marca:
                      type: string
                      example: Daikin Inverter Advance
                    btus:
                      type: integer
                      example: 18000
                    local_instalacao:
                      type: string
                      example: Sala TI / Servidores
    delete:
      summary: Remove um equipamento
      tags:
      - Equipamentos
      operationId: deleteEquipamento
      responses:
        '204':
          description: Equipamento removido com sucesso
  "/api/v1/equipamentos/{id}/historico_laudos":
    parameters:
    - name: id
      in: path
      description: ID do Equipamento
      example: 1
      required: true
      schema:
        type: integer
    get:
      summary: Histórico de laudos do equipamento em todas as ordens de serviço
      tags:
      - Equipamentos
      description: Retorna a linha do tempo completa de todos os laudos e pareceres
        técnicos já emitidos para este equipamento em todas as ordens de serviço atendidas.
      operationId: getHistoricoLaudosEquipamento
      responses:
        '200':
          description: Histórico retornado com sucesso em ordem decrescente de atendimento
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 12
                    laudo:
                      type: string
                      example: Higienização completa da serpentina e troca do capacitor
                        do motor do ventilador.
                    created_at:
                      type: string
                      format: date_time
                    updated_at:
                      type: string
                      format: date_time
                    ordem_servico:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 3
                        numero_ordem:
                          type: string
                          example: OS-2026-0044
                        descricao:
                          type: string
                          example: Manutenção periódica
                        data_agendamento:
                          type: string
                          format: date_time
                        data_fechamento:
                          type: string
                          format: date_time
                        status:
                          type: string
                          example: Finalizada
                        prioridade:
                          type: string
                          example: Normal
  "/api/v1/materiais":
    get:
      summary: Lista catálogo de materiais
      tags:
      - Materiais
      description: Retorna a lista de materiais cadastrados no catálogo com seus valores
        de referência.
      operationId: getMateriais
      responses:
        '200':
          description: Catálogo de materiais retornado
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    nome:
                      type: string
                      example: Gás refrigerante R410A
                    descricao:
                      type: string
                      nullable: true
                      example: Carga de fluido refrigerante R410A para sistemas split
                        e inverter.
                    valor_referencia:
                      type: string
                      nullable: true
                      example: '140.0'
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                type: object
    post:
      summary: Cadastra um novo material
      tags:
      - Materiais
      description: Adiciona um novo material ao catálogo (Administrador e Secretaria).
      operationId: createMaterial
      parameters: []
      responses:
        '201':
          description: Material cadastrado com sucesso
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Erro de validação
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                material:
                  type: object
                  properties:
                    nome:
                      type: string
                      example: Tubulação de cobre 1/4 pol.
                    descricao:
                      type: string
                      nullable: true
                      example: Metro de tubo de cobre flexível para linha frigorígena.
                    valor_referencia:
                      type: number
                      format: decimal
                      nullable: true
                      example: 45.0
                  required:
                  - nome
              required:
              - material
  "/api/v1/materiais/{id}":
    parameters:
    - name: id
      in: path
      description: ID único do Material
      example: 1
      required: true
      schema:
        type: integer
    get:
      summary: Visualiza detalhes de um material
      tags:
      - Materiais
      operationId: getMaterial
      responses:
        '200':
          description: Material encontrado
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Material não encontrado
          content:
            application/json:
              schema:
                type: object
    patch:
      summary: Atualiza dados de um material
      tags:
      - Materiais
      operationId: updateMaterial
      parameters: []
      responses:
        '200':
          description: Material atualizado
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Material não encontrado
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Erro de validação
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                material:
                  type: object
                  properties:
                    nome:
                      type: string
                      example: Tubulação de cobre 3/8 pol.
                    descricao:
                      type: string
                      nullable: true
                      example: Metro de tubo de cobre flexível reforçado.
                    valor_referencia:
                      type: number
                      format: decimal
                      nullable: true
                      example: 58.0
    delete:
      summary: Remove um material do catálogo
      tags:
      - Materiais
      operationId: deleteMaterial
      responses:
        '204':
          description: Material removido
        '403':
          description: Acesso negado
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Material não encontrado
          content:
            application/json:
              schema:
                type: object
  "/api/v1/ordem_servicos":
    get:
      summary: Lista ordens de serviço
      tags:
      - Ordens de Serviço
      description: Retorna a listagem de Ordens de Serviço. Administradores e Secretárias
        visualizam todas; Técnicos visualizam apenas as suas OSs atribuídas (Action
        Policy Scope).
      operationId: getOrdemServicos
      parameters:
      - name: cliente_id
        in: query
        required: false
        description: Filtrar ordens por cliente
        schema:
          type: integer
      - name: mes
        in: query
        required: false
        description: Filtrar por mês do agendamento (1 a 12)
        schema:
          type: integer
      - name: ano
        in: query
        required: false
        description: 'Filtrar por ano do agendamento (ex: 2026)'
        schema:
          type: integer
      responses:
        '200':
          description: Lista de ordens de serviço retornada
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Não autorizado
    post:
      summary: Abre uma nova ordem de serviço
      tags:
      - Ordens de Serviço
      description: Cria uma nova Ordem de Serviço com técnicos alocados, serviços
        orçados e equipamentos vinculados.
      operationId: createOrdemServico
      parameters: []
      responses:
        '201':
          description: Ordem de serviço criada com sucesso
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Erro de validação nos campos da OS
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Acesso negado (apenas Administradores e Secretárias podem criar
            OS)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Acesso negado
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ordem_servico:
                  type: object
                  properties:
                    numero_ordem:
                      type: string
                      example: OS-2026-0150
                    descricao:
                      type: string
                      example: Manutenção preventiva semestral e higienização química
                        de condicionadores de ar.
                    tipo_servico:
                      type: string
                      example: Preventiva
                    data_agendamento:
                      type: string
                      format: date_time
                      example: '2026-11-20T09:30:00Z'
                    data_vencimento:
                      type: string
                      format: date
                      example: '2026-11-25'
                    custo_estimado:
                      type: string
                      example: '950.00'
                    valor_total:
                      type: string
                      example: '950.00'
                    observacao:
                      type: string
                      example: Cliente solicita contato telefônico 30 minutos antes
                        da chegada da equipe técnica.
                    cliente_id:
                      type: integer
                      example: 1
                    endereco_id:
                      type: integer
                      example: 1
                    prioridade_id:
                      type: integer
                      example: 2
                    status_id:
                      type: integer
                      example: 1
                    user_ids:
                      type: array
                      description: Lista de IDs dos técnicos responsáveis pela OS
                      items:
                        type: integer
                      example:
                      - 2
                      - 4
                    servico_ids:
                      type: array
                      description: Lista de IDs dos serviços incluídos
                      items:
                        type: integer
                      example:
                      - 1
                      - 3
                    equipamento_ids:
                      type: array
                      description: Lista de IDs dos equipamentos do cliente a serem
                        atendidos
                      items:
                        type: integer
                      example:
                      - 1
                    os_equipamentos_attributes:
                      type: array
                      description: Laudo inicial ou específico por equipamento
                      items:
                        type: object
                        properties:
                          equipamento_id:
                            type: integer
                            example: 1
                          laudo:
                            type: string
                            example: Constatado acúmulo de poeira nas aletas e necessidade
                              de troca do capacitor.
                    os_materiais_attributes:
                      type: array
                      description: Materiais vinculados à OS (do catálogo ou avulsos)
                      items:
                        type: object
                        properties:
                          material_id:
                            type: integer
                            nullable: true
                            example: 1
                          nome_material:
                            type: string
                            example: Gás refrigerante R410A
                          valor:
                            type: number
                            format: decimal
                            example: 140.0
                  required:
                  - numero_ordem
                  - cliente_id
                  - endereco_id
                  - prioridade_id
                  - status_id
              required:
              - ordem_servico
